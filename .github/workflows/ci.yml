name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install coordinator dependencies
        run: npm --prefix coordinator ci

      # 1. TypeScript type validation (app + node configs).
      - name: Typecheck
        run: npm run typecheck

      # 2. Unit + integration tests: wire format, scheduler invariants,
      #    worker routing, and the OpenAI endpoint end to end (Vitest).
      - name: Unit tests
        run: npm test

      # 3. In-memory MockTransport tests (Playwright + headless Chromium).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run MockTransport tests
        run: npm run test:e2e:manual

      # Verifies the WebGPU decoder-layer kernels against the reference
      # implementation. Skips itself when the runner has no WebGPU adapter,
      # which is the normal case on hosted CI — it is the local gate.
      - name: Verify GPU kernels
        run: npm run test:e2e:gpu

      # 4. Production build verification.
      - name: Build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
